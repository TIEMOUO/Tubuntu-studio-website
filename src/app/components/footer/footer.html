<footer class="footer">
  <div class="container">
    <div class="footer-grid">

      <!-- BRAND -->
      <div class="footer-brand">
        <img src="assets/images/logo_white.png" alt="Tubuntu Studio" class="footer-logo">
        <p>{{ brand.tagline }}</p>
      </div>

      <!-- SOCIAL ICONS -->
      <div class="footer-social">
        <h3>Réseaux</h3>
        <div class="social-icons">
          @for(item of social; track item.label){
            <a 
              [href]="item.url" 
              target="_blank" 
              rel="noopener noreferrer"
              [attr.aria-label]="item.label"
              class="social-icon-btn"
            >
              <i [class]="item.icon"></i>
            </a>
          }
        </div>
      </div>

    </div>

    <!-- BOTTOM BAR -->
    <div class="footer-bottom">
      <p>
        © {{ year }} <span class="brand-tubuntu">Tubuntu</span><span class="brand-studio">Studio</span> — Tous droits réservés.
      </p>
    </div>
  </div>
</footer>
