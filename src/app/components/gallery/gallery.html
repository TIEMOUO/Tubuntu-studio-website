<section id="gallery" class="gallery-section">

  <div class="container">

    <div class="section-header text-center">

      <span class="section-badge">
        GALERIES
      </span>

      <h2>
        Découvrez notre univers
        <span>en images</span>
      </h2>

    </div>

    <div class="gallery-tabs">
      <button
        class="tab-btn"
        [class.active]="activeTab === 'studio'"
        (click)="activeTab = 'studio'">
        Photos du Studio
      </button>
      <button
        class="tab-btn"
        [class.active]="activeTab === 'material'"
        (click)="activeTab = 'material'">
        Matériel du Studio
      </button>
    </div>

    @if (activeTab === 'studio') {
      <div class="gallery-grid">
        @for (image of studioImages; track image) {
          <div class="gallery-item">
            <img [src]="image" [alt]="'Photo studio - ' + image" loading="lazy">
          </div>
        }
      </div>
    }

    @if (activeTab === 'material') {
      <div class="gallery-grid">
        @for (image of materialImages; track image) {
          <div class="gallery-item">
            <img [src]="image" [alt]="'Matériel studio - ' + image" loading="lazy">
          </div>
        }
      </div>
    }

    <!-- TODO: Remplacer par les images officielles du client -->

  </div>

</section>
